# Presentation tier: serve the built workspace, forward /api and /health to
# the processing tier on the private Compose network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 60m;          # uploads up to 50 MB per file

    location /api/ {
        proxy_pass http://processing:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;       # the demo load runs OCR on 26 files
    }
    location = /health {
        proxy_pass http://processing:8000/health;
    }
    location / {
        try_files $uri /index.html;    # single-page app
    }
}
